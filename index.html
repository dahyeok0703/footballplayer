<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>월드 풋볼 라이프 — 선수 육성 시뮬레이터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="header-row">
      <h1>⚽ 월드 풋볼 라이프</h1>
      <nav id="nav" class="hidden">
        <button data-view="hub" class="active">홈</button>
        <button data-view="player">내 선수</button>
        <button data-view="schedule">일정</button>
        <button data-view="league">리그</button>
        <button data-view="cup">컵</button>
        <button data-view="continental">대륙간</button>
        <button data-view="national">국가대표</button>
        <button data-view="transfers">이적</button>
        <button data-view="trophies">트로피</button>
        <button data-view="awards">개인상</button>
        <button data-view="upgrade">업그레이드</button>
        <button data-view="sns">SNS</button>
        <button data-view="dating">연애</button>
        <button data-view="world">세계</button>
        <button data-view="settings">⚙️</button>
      </nav>
    </div>
    <div id="status-bar" class="hidden">
      <span id="status-player"></span>
      <span id="status-club"></span>
      <span id="status-age"></span>
      <span id="status-ovr"></span>
      <span id="status-money"></span>
      <span id="status-date"></span>
      <button id="btn-advance" class="primary mini">다음 ▶</button>
      <button id="btn-save" class="mini">💾 저장</button>
    </div>
  </header>

  <main id="main"></main>

  <footer>
    <small>월드 풋볼 라이프 · 200+ 리그 · 실시간 인터리브 일정 · 로컬 저장</small>
  </footer>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
